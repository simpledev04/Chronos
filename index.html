<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChronosTrack</title>
<meta name="theme-color" content="#fafafa">
<style>
:root{--bg:#fafafa;--fg:#171717;--card:#fff;--bd:#e5e5e5;--mu:#a3a3a3;--mu2:#737373}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;font-size:16px}
svg{display:block}
.ic{width:1rem;height:1rem;flex:none}
.ic-lg{width:1.75rem;height:1.75rem;flex:none}
.wrap{max-width:28rem;margin:0 auto;padding:0 1.5rem 7.5rem}
.top{padding:2.5rem 0 1rem}
.eyebrow{display:flex;align-items:center;gap:.4rem;color:var(--mu);font-size:.8125rem;font-weight:500}
h1{font-size:1.5rem;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:.25rem 0 0}
.sub{color:var(--mu);font-size:.8125rem;margin:.25rem 0 0}
.hint{color:var(--mu);font-size:.75rem;margin:.35rem 0 0;font-weight:400}
.mt3{margin-top:.75rem}.mt6{margin-top:1.5rem}.mt8{margin-top:2rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:1rem}
.stack>*+*{margin-top:1rem}
.ctitle{font-size:.875rem;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.stat .k{font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:500}
.stat .v{font-size:1.5rem;font-weight:600;margin-top:.25rem;font-variant-numeric:tabular-nums}
.stat .n{font-size:.75rem;color:var(--mu);margin-top:.25rem;font-variant-numeric:tabular-nums}
.big{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:1.5rem;padding:2rem 1.5rem;display:flex;flex-direction:column;align-items:center;font:inherit;cursor:pointer;transition:transform .15s ease,background .2s,color .2s,border-color .2s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.big:active{transform:scale(.98)}
.big.on{background:var(--fg);border-color:var(--fg);color:#fff}
.ring{width:4rem;height:4rem;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#f5f5f5;margin-bottom:.75rem}
.big.on .ring{background:rgba(255,255,255,.15)}
.lbl{font-size:1.125rem;font-weight:600;letter-spacing:-.02em}
.live{font-size:.875rem;opacity:.7;font-variant-numeric:tabular-nums;margin-top:.25rem}
.btn{border-radius:.75rem;border:1px solid transparent;font:inherit;font-size:.875rem;font-weight:600;padding:.85rem 1rem;display:flex;align-items:center;justify-content:center;gap:.5rem;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
.btn:active{transform:scale(.99)}
.btn.wide{width:100%}
.btn.dark{background:var(--fg);color:#fff}
.btn.ghost{background:var(--card);border-color:var(--bd);color:#404040;font-weight:500}
.btn.ghost:hover{border-color:#d4d4d4}
.btn.danger{color:#dc2626}
.sec{display:flex;align-items:center;gap:.5rem;color:var(--mu2);font-size:.875rem;font-weight:500;margin-bottom:.75rem}
.empty{color:var(--mu);font-size:.875rem;text-align:center;padding:2.5rem 0;margin:0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.row{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:1rem;display:flex;align-items:center;justify-content:space-between}
.row.on{background:var(--fg);border-color:var(--fg);color:#fff}
.rleft{display:flex;align-items:center;gap:.75rem;min-width:0}
.t{font-size:.875rem;font-weight:500;font-variant-numeric:tabular-nums}
.d{font-size:.75rem;color:var(--mu);font-variant-numeric:tabular-nums}
.row.on .d{color:rgba(255,255,255,.6)}
.dot{width:.5rem;height:.5rem;border-radius:999px;background:#d4d4d4;flex:none}
.dot.ok{background:#34d399}.dot.warn{background:#fbbf24}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.tag{font-size:.625rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#d97706;margin-right:.4rem}
.row.on .tag{color:#fcd34d}
.racts{display:flex;align-items:center;gap:.25rem}
.x{background:none;border:0;padding:.5rem;color:#a3a3a3;cursor:pointer;display:flex;border-radius:.5rem;text-decoration:none}
.x:hover{color:#525252}
.row.on .x{color:rgba(255,255,255,.7)}
.foot{display:flex;align-items:center;justify-content:center;gap:.35rem;color:var(--mu);font-size:.75rem;padding:1.5rem 0;margin:0}
.grp+.grp{margin-top:1.5rem}
.ghead{display:flex;align-items:center;justify-content:space-between;padding:0 .25rem;margin-bottom:.5rem}
.ghead span:first-child{font-size:.875rem;font-weight:600}
.gtot{font-size:.875rem;font-weight:500;color:var(--mu2);font-variant-numeric:tabular-nums}
.gmuted{color:var(--mu)}
.fld{display:block}
.fld>span{display:block;font-size:.875rem;font-weight:500;margin-bottom:.4rem}
.fld .lbl-ic{display:flex;align-items:center;gap:.35rem;color:var(--mu)}
input[type=text],input[type=number],input[type=datetime-local],select{width:100%;border:1px solid var(--bd);background:var(--card);border-radius:.75rem;padding:.8rem 1rem;font:inherit;font-size:.875rem;color:inherit;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--fg)}
input[type=number],input[type=datetime-local]{font-variant-numeric:tabular-nums}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23a3a3a3' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 1rem center;padding-right:2.5rem}
[dir=rtl] select{background-position:left 1rem center;padding-right:1rem;padding-left:2.5rem}
.rowline{display:flex;align-items:center;justify-content:space-between;margin-top:1rem}
.rowline span{font-size:.875rem;color:var(--mu2)}
.rowline b{font-size:1.125rem;font-weight:600;font-variant-numeric:tabular-nums}
.err{background:#fef2f2;border:1px solid #fee2e2;color:#dc2626;font-size:.875rem;border-radius:.75rem;padding:.75rem 1rem;margin-top:1rem}
.err[hidden]{display:none}
.warn{background:#fffbeb;border:1px solid #fef3c7;color:#b45309;font-size:.75rem;border-radius:.75rem;padding:.75rem;margin:0}
.hidein{display:none}
.back{display:inline-flex;padding:.5rem;margin:0 0 .25rem -.5rem;border-radius:999px;color:var(--mu2)}
.back:hover{color:var(--fg)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--bd);z-index:20}
.nav .in{max-width:28rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.75rem 0;font-size:.6875rem;font-weight:500;color:var(--mu);text-decoration:none}
.nav a.on{color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5.5rem;background:#171717;color:#fff;font-size:.8125rem;padding:.7rem 1.1rem;border-radius:999px;z-index:50;max-width:22rem;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex}
.toast[hidden]{display:none}
.bars{display:flex;align-items:flex-end;gap:.375rem;height:3rem;margin-top:.75rem}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars .bar{width:100%;background:rgba(23,23,23,.85);border-radius:2px}
.days{display:flex;gap:.375rem;margin-top:.25rem}
.days span{flex:1;text-align:center;font-size:.625rem;color:#d4d4d4}
.wmeta{display:flex;align-items:center;justify-content:space-between;font-size:.75rem;color:var(--mu);margin-top:.75rem}
.wtop{display:flex;align-items:baseline;justify-content:space-between}
.wtop .wd{font-size:.875rem;font-weight:600}
.wtop .wt{font-size:1.125rem;font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>

  function fmtTime(iso) {

  function exportData() {

      var url = URL.createObjectURL(blob);

  function importFile(file) {

        var parsed = JSON.parse(String(reader.result));
        var incoming = parsed && Array.isArray(parsed.entries) ? parsed.entries : [];
        var seen = {};
        state.data.entries.forEach(function (e) { seen[e.id] = true; });
        var added = 0;
        incoming.forEach(function (e) {
          if (!e || !e.check_in) return;
          var id = e.id || uid();
          if (seen[id]) return;
          seen[id] = true;
          state.data.entries.push({
            id: id,
            check_in: e.check_in,
            check_out: e.check_out || null,
            duration_minutes: e.duration_minutes == null
              ? (e.check_out ? Math.round(minutesBetween(e.check_in, e.check_out)) : null)
              : e.duration_minutes,
            type: e.type === "break" ? "break" : "work"
          });
          added++;
        });
        var s = parsed && parsed.settings;
        if (s) {
          if (state.data.settings.weekly_goal == null && s.weekly_goal != null && s.weekly_goal !== "") {
            state.data.settings.weekly_goal = Number(s.weekly_goal);

        render();

      } catch (err) {
        toast(t("data.importError"));

    };
    reader.readAsText(file);
  }

    h += "</form>";
    h += '<div class="card stack mt6">' +
      '<div><div class="ctitle">' + esc(t("data.title")) + '</div><p class="hint">' + esc(t("data.help")) + "</p></div>" +
      '<div class="grid2">' +
      '<button type="button" class="btn ghost" data-act="export">' + icon("download") + " " + esc(t("data.export")) + "</button>" +
      '<button type="button" class="btn ghost" data-act="import">' + icon("upload") + " " + esc(t("data.import")) + "</button>" +
      "</div>" +
      '<input type="file" id="fileInput" accept="application/json,.json" class="hidein">' +
      (state.storageOk ? "" : '<p class="warn">' + esc(t("settings.storageWarning")) + "</p>") +
      '<p class="hint" style="margin-top:.75rem">' + esc(t("settings.local")) + "</p>" +
      "</div>";
    h += "</div>" + nav("settings");
    return h;
  }

  function viewEdit(id) {
    var entry = state.data.entries.filter(function (e) { return e.id === id; })[0];
    var h = '<div class="wrap"><div class="top"><a class="back" href="#/history" aria-label="' + esc(t("edit.back")) + '">' + icon("back") + "</a>" +
      "<h1>" + esc(t("edit.title")) + '</h1><p class="sub">' + esc(t("edit.subtitle")) + "</p></div>";
    if (!entry) {
      h += '<p class="empty">' + esc(t("edit.noSession")) + "</p></div>";
      return h;
    }
    var mins = entry.check_out && new Date(entry.check_out) > new Date(entry.check_in)
      ? minutesBetween(entry.check_in, entry.check_out) : null;
    h += '<form id="editForm" class="stack" data-id="' + esc(entry.id) + '">';
    h += '<label class="fld"><span>' + esc(t("edit.checkIn")) + '</span><input type="datetime-local" id="fIn" value="' + esc(toLocalInput(entry.check_in)) + '"></label>';
    h += '<label class="fld"><span>' + esc(t("edit.checkOut")) + '</span><input type="datetime-local" id="fOut" value="' + esc(toLocalInput(entry.check_out)) + '"><span class="hint">' + esc(t("edit.openHelp")) + "</span></label>";
    h += '<div class="card rowline"><span>' + esc(t("edit.duration")) + '</span><b id="prev">' + esc(mins != null ? fmtDuration(mins) : "—") + "</b></div>";
    h += '<div class="err" id="editErr" hidden></div>';
    h += '<button type="submit" class="btn dark wide">' + icon("check") + " " + esc(t("profile.save")) + "</button>";
    h += '<button type="button" class="btn ghost wide danger" data-act="del" data-id="' + esc(entry.id) + '">' + icon("trash") + " " + esc(t("edit.delete")) + "</button>";
    h += "</form></div>";
    return h;
  }

  var lastRoute = "";
  function parseRoute() {
    var raw = location.hash.replace(/^#/, "") || "/";
    if (raw.indexOf("/edit/") === 0) return { name: "edit", id: raw.slice(6) };
    if (raw === "/history") return { name: "history" };
    if (raw === "/report") return { name: "report" };
    if (raw === "/settings") return { name: "settings" };
    return { name: "today" };
  }

  function render() {
    var r = parseRoute();
    document.documentElement.lang = locale();
    document.documentElement.dir = RTL_LANGUAGES.indexOf(locale()) >= 0 ? "rtl" : "ltr";
    var app = document.getElementById("app");
    if (r.name === "history") app.innerHTML = viewHistory();
    else if (r.name === "report") app.innerHTML = viewReport();
    else if (r.name === "settings") app.innerHTML = viewSettings();
    else if (r.name === "edit") app.innerHTML = viewEdit(r.id);
    else app.innerHTML = viewToday();
    if (r.name !== lastRoute) {
      lastRoute = r.name;
      window.scrollTo(0, 0);
    }
  }

  function liveTick() {
    var open = openEntry();
    if (!open) return;
    var dur = fmtDuration(minutesBetween(open.check_in, new Date()));
    var prefix = (isBreak(open) ? t("home.lunchPrefix") : "") + dur;
    var nodes = document.querySelectorAll("[data-live]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = nodes[i].getAttribute("data-live") === "prefix" ? prefix : dur;
    }
  }

  function readForm() {
    return {
      lang: document.getElementById("fLang")
    };
  }

  function applyForm() {
    var f = readForm();
    if (f.lang && f.lang.value) state.data.settings.lang = f.lang.value;
    save();
    return true;
  }

  function onAppClick(ev) {
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");
    if (act === "checkin") {
      state.data.entries.push(newEntry("work"));
      save(); render();
    } else if (act === "checkout") {
      closeOpen(); save(); render();
    } else if (act === "break") {
      closeOpen();
      state.data.entries.push(newEntry("break"));
      save(); render();
    } else if (act === "endbreak") {
      closeOpen();
      state.data.entries.push(newEntry("work"));
      save(); render();
    } else if (act === "del") {
      deleteEntry(id);
    } else if (act === "export") {
      exportData();
    } else if (act === "import") {
      var input = document.getElementById("fileInput");
      if (input) input.click();
    }
  }

  function onAppSubmit(ev) {
    var form = ev.target;
    if (form.id === "settingsForm") {
      ev.preventDefault();
applyForm(); render();
      toast(t("profile.saved"));
    } else if (form.id === "editForm") {
      ev.preventDefault();
      var id = form.getAttribute("data-id");
      var entry = state.data.entries.filter(function (e) { return e.id === id; })[0];
      var errEl2 = document.getElementById("editErr");
      if (!entry) return;
      var a = fromLocalInput(document.getElementById("fIn").value);
      var b = fromLocalInput(document.getElementById("fOut").value);
      if (!a) { errEl2.textContent = t("edit.noStart"); errEl2.hidden = false; return; }
      if (b && new Date(b) <= new Date(a)) { errEl2.textContent = t("edit.endBeforeStart"); errEl2.hidden = false; return; }
      entry.check_in = a;
      entry.check_out = b;
      entry.duration_minutes = b ? Math.round(minutesBetween(a, b)) : null;
      save();
      location.hash = "#/history";
      render();
    }
  }

  function onAppChange(ev) {
    if (ev.target.id === "fLang") {
      applyForm();
      render();
    } else if (ev.target.id === "fileInput") {
      var file = ev.target.files && ev.target.files[0];
      ev.target.value = "";
      if (file) importFile(file);
    }
  }

  function onAppInput(ev) {
    if (ev.target.id !== "fIn" && ev.target.id !== "fOut") return;
    var prev = document.getElementById("prev");
    if (!prev) return;
    var a = fromLocalInput(document.getElementById("fIn").value);
    var b = fromLocalInput(document.getElementById("fOut").value);
    var mins = a && b && new Date(b) > new Date(a) ? minutesBetween(a, b) : null;
    prev.textContent = mins != null ? fmtDuration(mins) : "—";
  }

  var app = document.getElementById("app");
  app.addEventListener("click", onAppClick);
  app.addEventListener("submit", onAppSubmit);
  app.addEventListener("change", onAppChange);
  app.addEventListener("input", onAppInput);
  window.addEventListener("hashchange", render);
  setInterval(liveTick, 1000);
  render();
})();
</script>
</body>
</html>
